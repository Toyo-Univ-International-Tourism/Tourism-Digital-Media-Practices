<h1>宮古島絶景ツアー</h1>

<p>
宮古島は沖縄県を代表する人気の観光地で、美しい海と豊かな自然に囲まれています。
この360°バーチャルツアーでは、エメラルドグリーンに輝く海や白い砂浜、
開放感あふれる絶景スポットを、まるで現地を歩いているような感覚で楽しむことができます。
ホットスポットをクリックすると次のスポットへ移動でき、
宮古島の魅力を自由に巡ることができます。
ぜひ、美しい景色とともに宮古島の魅力を体験してください。
</p>

</p>

<button id="tourBtn">
