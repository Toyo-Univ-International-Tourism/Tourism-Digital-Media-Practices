<!DOCTYPE html>
<html>
    <head>
        <!-- 文字コードの指定：日本語が文字化けしないようにする -->
        <meta charset="utf-8">
        <!-- ブラウザのタブに表示されるページのタイトル -->
        <title>観光ガイド - 日本の名所</title>
        <!-- 見た目（デザイン）を定義した CSS ファイルを読み込む -->
        <link rel="stylesheet" href="styles.css">
        <!-- 動き（処理）を定義した JavaScript ファイルを読み込む
             defer：HTML をすべて読み込み終えてから実行する指定 -->
        <script defer src="script.js"></script>
    </head>
    <body>
        <!-- ページ上部の見出し部分 -->
        <header>
            <h1>日本の観光名所</h1>
        </header>
        <!-- ページの本文（メインコンテンツ）部分 -->
        <main>
            <section id="home">
                <p>日本の観光名所を日替わりで紹介します。</p>
                <!-- おすすめスポットを表示するボタン
                     id="infoButton"：script.js がこの id を使ってボタンを取得し、
                     クリック時に showInfo 関数が実行されるよう設定している -->
                <button id="infoButton">今日のおすすめスポットを見る</button>
                <!-- スポット情報の表示エリア
                     style="display:none;"：最初は非表示にしておき、
                     ボタンが押されると script.js が display を "block" に変えて表示する -->
                <div id="infoContainer" style="display:none;">
                    <!-- スポット名の表示場所：script.js が innerText で文字を入れる -->
                    <p id="infoTitle"></p>
                    <!-- 説明文の表示場所：script.js が innerText で文章を入れる -->
                    <p id="infoDesc"></p>
                    <!-- 画像の表示場所：src と alt は最初は空にしておき、
                         script.js が画像ファイル名と代替テキストを設定する -->
                    <img id="infoImage" src="" alt="" width="400">
                </div>
            </section>
        </main>
        <!-- ページ下部の著作権表示部分 -->
        <footer>
            <p>&copy; 2025 東洋観光ガイド</p>
        </footer>
    </body>
</html>
